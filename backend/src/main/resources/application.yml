spring:
  application:
    name: milk-delivery-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/milk_delivery}
    username: ${DB_USERNAME:milkadmin}
    password: ${DB_PASSWORD:milkadmin123}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:true}

server:
  port: ${PORT:8080}

razorpay:
  key-id: RAZORPAY_ID
  key-secret: RAZORKEY_SECRET

jwt:
  secret: your-super-secret-key-which-should-be-at-least-32-characters-long
  expiration: 86400000

  logging:
    level:
      org.hibernate.SQL: DEBUG
      org.hibernate.orm.jdbc.bind: TRACE
# Configure SMTP credentials through deployment environment variables.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
