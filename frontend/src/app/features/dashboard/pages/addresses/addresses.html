<div class="addresses-page">
  <div class="header">
    <h1>My Addresses</h1>

    <button mat-raised-button color="primary" (click)="addAddress()">Add Address</button>
  </div>

  <div class="address-grid">
    @for (address of addresses; track $index) {
      <mat-card>
        <div class="card-header">
          <h3>
            {{ address.type }}
          </h3>

          @if (address.default) {
            <mat-chip> Default </mat-chip>
          }
        </div>

        <p>
          {{ address.name }}
        </p>

        <p>
          {{ address.addressLine }}
        </p>

        <p>
          {{ address.city }}
        </p>

        <div class="actions">
          <button mat-icon-button (click)="editAddress(address, $index)">
            <mat-icon> edit </mat-icon>
          </button>

          <button mat-icon-button (click)="deleteAddress($index)">
            <mat-icon> delete </mat-icon>
          </button>
        </div>
      </mat-card>
    }
  </div>
</div>
