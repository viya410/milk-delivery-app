<h2 mat-dialog-title>

  New Subscription

</h2>

<mat-dialog-content>

  <form [formGroup]="subscriptionForm">

    <mat-form-field appearance="outline">

      <mat-label>

        Product

      </mat-label>

      <mat-select formControlName="productId">

        @for (product of products(); track product.id) {

          <mat-option [value]="product.id">

            {{ product.name }}

          </mat-option>

        }

      </mat-select>

    </mat-form-field>

    <mat-form-field appearance="outline">

      <mat-label>

        Quantity

      </mat-label>

      <input
        matInput
        type="number"
        min="1"
        formControlName="quantity"
      >

    </mat-form-field>

    <mat-form-field appearance="outline">

      <mat-label>

        Frequency

      </mat-label>

      <mat-select formControlName="frequency">

        @for (frequency of frequencies; track frequency) {

          <mat-option [value]="frequency">

            {{ frequency.replace('_', ' ') }}

          </mat-option>

        }

      </mat-select>

    </mat-form-field>

    <mat-form-field appearance="outline">

      <mat-label>

        Start Date

      </mat-label>

      <input
        matInput
        [matDatepicker]="startPicker"
        formControlName="startDate"
      >

      <mat-datepicker-toggle
        matSuffix
        [for]="startPicker"
      >
      </mat-datepicker-toggle>

      <mat-datepicker #startPicker></mat-datepicker>

    </mat-form-field>

    <mat-form-field appearance="outline">

      <mat-label>

        End Date (Optional)

      </mat-label>

      <input
        matInput
        [matDatepicker]="endPicker"
        formControlName="endDate"
      >

      <mat-datepicker-toggle
        matSuffix
        [for]="endPicker"
      >
      </mat-datepicker-toggle>

      <mat-datepicker #endPicker></mat-datepicker>

    </mat-form-field>

  </form>

</mat-dialog-content>

<mat-dialog-actions align="end">

  <button
    mat-button
    (click)="cancel()"
  >

    Cancel

  </button>

  <button
    mat-raised-button
    color="primary"
    (click)="save()"
  >

    Create Subscription

  </button>

</mat-dialog-actions>
