<section class="products-page">
  <div class="hero">
    <div class="hero-left">
      <span class="hero-tag"> 🌿 100% Farm Fresh </span>

      <h1>Fresh Dairy Delivered Daily</h1>

      <p>Milk, Curd, Butter, Paneer & more, delivered fresh from our farm.</p>
    </div>

    <div class="hero-right">🥛</div>
  </div>

  <div class="search-section">
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>

      <input placeholder="Search milk, paneer, butter..." (input)="search($event)" />
    </div>
  </div>

  <div class="category-list">
    <button class="active">All</button>

    <button class="coming-soon">🥛 Milk</button>

    <button class="coming-soon">🥣 Curd</button>

    <button class="coming-soon">🧀 Paneer</button>

    <button class="coming-soon">🧈 Butter</button>

    <button class="coming-soon">🍯 Ghee</button>
  </div>

  <div class="products-grid">
    @for (product of filteredProducts(); track product.id) {
      <app-product-card
        [product]="product"
        [quantity]="cartService.getQuantity(product.id)"
        (view)="viewProduct($event)"
        (add)="addToCart($event)"
        (increase)="increase($event)"
        (decrease)="decrease($event)"
      >
      </app-product-card>
    }
  </div>
</section>
