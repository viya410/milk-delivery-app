<h2 mat-dialog-title>

  {{ data ? 'Edit User' : 'Add User' }}

</h2>

<mat-dialog-content>

  <form

    [formGroup]="form"

  >

    <mat-form-field appearance="outline">

      <mat-label>

        Full Name

      </mat-label>

      <input

        matInput

        formControlName="fullName"

      >

    </mat-form-field>

    <mat-form-field appearance="outline">

      <mat-label>

        Email

      </mat-label>

      <input

        matInput

        formControlName="email"

      >

    </mat-form-field>

    <mat-form-field appearance="outline">

      <mat-label>

        Phone Number

      </mat-label>

      <input

        matInput

        formControlName="phoneNumber"

      >

    </mat-form-field>

    <mat-form-field appearance="outline">

      <mat-label>

        Role

      </mat-label>

      <mat-select

        formControlName="role"

      >

        @for(role of roles; track role){

          <mat-option

            [value]="role"

          >

            {{ role }}

          </mat-option>

        }

      </mat-select>

    </mat-form-field>

  </form>

</mat-dialog-content>

<mat-dialog-actions align="end">

  <button

    mat-button

    mat-dialog-close

  >

    Cancel

  </button>

  <button

    mat-raised-button

    color="primary"

    (click)="save()"

  >

    Save

  </button>

</mat-dialog-actions>
