<h2 mat-dialog-title>

  {{ title }}

</h2>

<form

  [formGroup]="form"

>

  <mat-form-field

    appearance="outline"

    class="full-width"

  >

    <mat-label>

      Product

    </mat-label>

    <input

      matInput

      [value]="data.inventory.productName"

      readonly

    />

  </mat-form-field>

  <mat-form-field

    appearance="outline"

    class="full-width"

  >

    <mat-label>

      Quantity

    </mat-label>

    <input

      matInput

      type="number"

      formControlName="quantity"

    />

  </mat-form-field>

  @if(data.action === 'ADJUST') {

    <small class="hint">

      Enter the final stock quantity after physical verification.

    </small>

  }

  <mat-form-field

    appearance="outline"

    class="full-width"

  >

    <mat-label>

      Remarks

    </mat-label>

    <textarea

      matInput

      rows="3"

      formControlName="remarks"

    >

    </textarea>

  </mat-form-field>

</form>

<div class="dialog-actions">

  <button

    mat-button

    (click)="dialogRef.close()"

  >

    Cancel

  </button>

  <button

    mat-raised-button

    color="primary"

    (click)="save()"

    [disabled]="form.invalid"

  >

    Save

  </button>

</div>
