@if (loaderService.loading()) {
  <div class="loader-overlay">
    <div class="loader-content">
      <video class="loader-video" autoplay muted loop playsinline preload="auto">
        <source src="assets/videos/login-loader.mp4" type="video/mp4" />
      </video>

      <p class="loader-text">Preparing your fresh experience...</p>
    </div>
  </div>
}
