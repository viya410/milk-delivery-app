<div class="product-card">
  <div class="image-wrapper" (click)="viewProduct()">
    <img #productImage [src]="'assets/images/products/' + product.imageUrl" [alt]="product.name" />
    @if (quantity > 0) {
      <span class="cart-quantity-badge" aria-live="polite">
        In cart <strong>{{ quantity }}</strong>
      </span>
    }
  </div>

  <div class="card-content">
    <span class="farm-badge"> 🌿 Farm Fresh </span>

    <h3 class="product-name" (click)="viewProduct()">
      {{ product.name }}
    </h3>

    <p class="product-unit">
      <b class="price">₹{{ getDisplayPrice() }}</b
      >/{{ getDisplayUnit() }}
    </p>

    <div class="bottom-section">
      @if (quantity === 0) {
        <button type="button" class="add-btn" (click)="addToCart($event)">ADD</button>
      } @else {
        <div class="quantity-controls" (click)="$event.stopPropagation()">
          <button type="button" (click)="decrease.emit(product.id)">-</button>

          <span>
            {{ quantity }}
          </span>

          <button type="button" (click)="increase.emit(product.id)">+</button>
        </div>
      }
    </div>
  </div>
</div>
